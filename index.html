<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena de Weones</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#b8481f"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: rowdy, warm, playful arena brawl with loot
   IDEA: a sun-baked clay amphitheatre where pirates, samurai and cowboys trade blows
   PICTURE: the arena canvas: torches, pennants, cheering crowd, geared fighters, pets, projectiles
   COLOUR and TYPE: terracotta dominant, sand support, teal accent, rarity colours; Lilita One + Nunito
   LAYOUT: phone column; header with gold, sticky tabs (Arena, Torneo, Equipo, Mercader); fight = arena, skill buttons, log */
:root{color-scheme:light dark;--bg:light-dark(#f4e6cc,#1d140f);--ink:light-dark(#2b1a10,#f4e6cc);--card:light-dark(#fff7e8,#2b1f17);--line:light-dark(#e2cfae,#45332a);--terra:#b8481f;--terra2:#8f3313;--teal:#17808a;--muted:light-dark(#7a6250,#b9a48f);--r0:#9aa0a6;--r1:#3d8bfd;--r2:#a55eea;--r3:#f39c12}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.big{font-family:"Lilita One",Impact,sans-serif;font-weight:400;letter-spacing:.4px;margin:0;line-height:1.05}
.top{background:var(--terra);color:#fbead0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:5px solid var(--terra2)}
.top h1{font-size:26px;text-shadow:0 3px 0 var(--terra2)}
.gold{display:flex;align-items:center;gap:6px;font-weight:800;background:rgba(0,0,0,.18);padding:4px 12px 4px 6px;border-radius:99px;font-variant-numeric:tabular-nums}
.gold[hidden]{display:none}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a0,#e0a52a 60%,#a8720f);box-shadow:inset 0 0 0 2px #c48a1a;flex:none}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--bg);border-bottom:2px solid var(--line)}
.tabs button{background:none;box-shadow:none;color:var(--muted);border-radius:0;min-height:50px;padding:6px 1px;font-size:12.5px;border-bottom:4px solid transparent}
.tabs button.on{color:var(--terra);border-bottom-color:var(--terra)}
.tabs button:active{transform:none}
main{max-width:560px;margin:0 auto;padding:16px}
section,.tab{display:none}section.on,.tab.on{display:block}
#sHome.on{padding:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
button{font:inherit;font-weight:800;border:0;cursor:pointer;border-radius:14px;min-height:46px;padding:10px 16px;color:#fff8ec;background:var(--terra);box-shadow:0 4px 0 var(--terra2);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--terra2)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line)}
button.alt{background:var(--teal);box-shadow:0 4px 0 #0e5960}
button.wide{width:100%;font-size:19px}
button.sm{min-height:38px;padding:6px 12px;font-size:14px}
input{font:inherit;font-size:20px;font-weight:800;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
label{font-weight:800;display:block;margin:14px 0 6px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 12px}
canvas.pic{display:block;background:linear-gradient(#f2a65a,#fbe3b0 72%,#e7bf7f 72%)}
.prev{width:100%;height:210px;border-radius:18px}
.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cl{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none;padding:6px 8px;min-height:64px}
.cl canvas{width:52px;height:58px;border-radius:9px}
.cl b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:17px;display:block}
.cl small{display:block;font-size:12px;color:var(--muted);line-height:1.25}
.cl.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.me{display:grid;grid-template-columns:116px minmax(0,1fr);gap:14px;align-items:center}
.me canvas{width:116px;height:136px;border-radius:14px}
.me h2{font-size:28px}
.lv{font-weight:800;color:var(--muted)}
.xp{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0 4px}.xp i{display:block;height:100%;background:var(--teal);border-radius:9px}
.rec{font-size:14px;color:var(--muted);font-weight:700}
.stats{display:grid;gap:7px;margin-top:14px}
.st{display:grid;grid-template-columns:84px minmax(0,1fr) 40px;gap:8px;align-items:center;font-weight:800;font-size:15px}
.st .b{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.st .b i{display:block;height:100%;background:var(--terra)}
.st span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--bg);border:2px solid var(--line)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;gap:10px}
.sec h2{font-size:23px}
.list{display:grid;gap:10px}
.rv{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);padding:8px 12px 8px 8px;width:100%}
.rv:active{box-shadow:0 1px 0 var(--line)}
.rv canvas{width:70px;height:80px;border-radius:10px}
.rv b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:19px;display:block}
.rv small{color:var(--muted);font-weight:700;display:block;font-size:13px;line-height:1.35}
.rv .go{font-family:"Lilita One",sans-serif;font-size:17px;color:var(--terra)}
.rv.boss{border-color:#7b2d8e;box-shadow:0 4px 0 #7b2d8e}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--rc);border-radius:14px;padding:8px 10px}
.item canvas{width:52px;height:52px;border-radius:10px;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 28%,transparent),transparent 70%)}
.item b{display:block;font-weight:800;line-height:1.2}
.item .rn{font-size:12px;font-weight:800;color:var(--rc)}
.item small{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.item small.abt{color:var(--teal);font-weight:700}
.item button{min-height:40px;padding:6px 10px;font-size:14px;white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-left:6px solid var(--rc,var(--line));box-shadow:none;padding:6px 8px;min-height:62px}
.slot canvas{width:44px;height:44px}
.slot small{display:block;font-size:11px;color:var(--muted);font-weight:800}
.slot b{display:block;font-size:14px;line-height:1.15;color:var(--rc,var(--muted))}
.ladder{display:grid;gap:8px}
.rung{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:700}
.rung.done{opacity:.55}.rung.next{border-color:var(--teal)}.rung.bossr{border-color:#7b2d8e}
.rung span:last-child{font-size:13px;color:var(--muted);white-space:nowrap}
.merch{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.merch canvas{width:110px;height:120px;border-radius:14px}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700}
.bars{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end;margin-bottom:10px}
.hb b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb.r{text-align:right}
.hb .b{height:16px;border-radius:9px;background:var(--line);overflow:hidden;border:2px solid var(--line)}
.hb .b{position:relative}.hb .b i,.hb .b u{position:absolute;top:0;bottom:0;left:0}.hb .b i{background:#3aa655}.hb .b u{background:#ffe08a;transition:width .5s .25s}
.hb.r .b i,.hb.r .b u{left:auto;right:0}
.hb small{font-weight:800;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.vs{font-family:"Lilita One",sans-serif;color:var(--terra);font-size:22px;padding-bottom:4px}
.arena{position:relative;aspect-ratio:400/250;border-radius:18px;overflow:hidden;border:3px solid var(--terra2)}
.arena canvas{position:absolute;inset:0;width:100%;height:100%}
.abs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:12px}
.ab{position:relative;overflow:hidden;background:#2b4a52;box-shadow:0 4px 0 #18303a;padding:8px 6px;min-height:58px;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.ab i{position:absolute;left:0;right:0;bottom:0;background:rgba(10,10,10,.55);pointer-events:none}
.ab b{position:relative;font-size:14px}.ab small{position:relative;font-size:11px;opacity:.8;font-weight:700}
.ab.rdy{background:var(--teal);box-shadow:0 4px 0 #0e5960,0 0 0 3px #7ee0e6;animation:pulse 1.1s infinite}
.ab.q{box-shadow:0 4px 0 #0e5960,0 0 0 3px #ffd23f}
@keyframes pulse{50%{box-shadow:0 4px 0 #0e5960,0 0 0 6px rgba(126,224,230,.35)}}
.log{min-height:80px;margin:10px 0;font-size:14px;font-weight:700}
.log p{margin:2px 0;opacity:.5}.log p:last-child{opacity:1}
.ctrl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ctrl button{padding:8px 4px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,10,5,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.box{background:var(--bg);border-radius:22px;padding:20px 16px;max-width:440px;width:100%;max-height:88vh;overflow:auto;border:3px solid var(--terra)}
.box .big{font-size:40px;color:var(--terra);text-align:center}
.box>p{margin:8px 0 14px;font-weight:700;text-align:center}
.box .list{margin-bottom:14px}
.offer{display:block;width:100%;text-align:left;margin-bottom:12px;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);padding:12px 14px}
.offer em{font-style:normal;font-size:12px;font-weight:800;color:var(--teal)}
.offer b{display:block;font-family:"Lilita One",sans-serif;font-weight:400;font-size:21px}
.offer span{display:block;color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-weight:700;text-align:center;padding:14px}

.ros{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.ros.on{border-color:var(--teal)}
.ros canvas{width:56px;height:64px;border-radius:10px}
.ros b{display:block;font-family:"Lilita One",sans-serif;font-weight:400;font-size:18px}
.ros b em{font-family:Nunito,sans-serif;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--teal);border-radius:99px;padding:2px 8px;vertical-align:middle}
.ros small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.ros .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}.ros .acts:empty{display:none}
.hurt{color:#d0402b;font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{background:transparent;color:var(--muted);box-shadow:none;min-height:42px}.seg button.on{background:var(--card);color:var(--terra);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.mini{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.mini canvas{width:56px;height:64px;border-radius:10px}.mini b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:19px;display:block}.mini small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pk{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none;padding:6px}
.pk.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}.pk canvas{width:50px;height:56px;border-radius:9px}.pk b{font-size:13px;line-height:1.1;text-align:center}.pk small{font-size:11px;color:var(--muted)}
.rv3{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);padding:8px 12px 8px 8px}
.rv3 b{display:block;font-size:15px;line-height:1.2}.rv3 small{display:block;font-size:12px;color:var(--muted);font-weight:700}.rv3 .go{font-family:"Lilita One",sans-serif;font-size:17px;color:var(--terra)}
.trio{display:flex;gap:2px}.trio canvas{width:34px;height:46px;border-radius:7px}
.fame{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;margin-top:12px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:15px}
.fame small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.starI{width:26px;height:26px;background:#f3b52a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.who .chip{min-height:38px;cursor:pointer;color:var(--ink)}.who .chip.on{border-color:var(--teal);background:var(--teal);color:#fff}
.res p{margin:4px 0;font-size:14px;text-align:left}
.bars{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.side{display:grid;gap:6px}

lay:inline-block;margin-top:3px;color:#c08bff;font-weight:700}.item small span{white-space:nowrap}.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}.upc{color:#f4efe4;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:12px;background:#2a201b;border:2px solid #3d302a;text-align:center}.upc canvas{width:52px;height:52px}.upc b{font-size:14px;line-height:1.15}.upc small{font-size:12px;opacity:.9}.upc button{width:100%;padding:8px 4px;font-size:13px}.eqb{background:#1f8a7a;color:#fff;border-radius:6px;padding:1px 5px;font-size:11px}.hb .b{grid-column:1/-1}.hb .sti{grid-column:1/-1;display:flex;gap:3px;align-items:center;flex-wrap:wrap;min-height:18px;margin-top:2px}.hb.r .sti{flex-direction:row-reverse}.hb .stx{display:flex;gap:3px;flex-wrap:wrap}.hb .stx span{pointer-events:auto;cursor:help;min-width:22px;text-align:center;background:rgba(0,0,0,.45);border-radius:6px;padding:0 3px;font-size:13px;line-height:18px}.hb .lvt{font-style:normal;font-weight:800;font-size:12px;color:#fff;opacity:.85;text-shadow:0 1px 0 rgba(0,0,0,.8);white-space:nowrap}.bars.multi .hb small{grid-row:1;grid-column:2}.bars.multi .side{gap:4px}.bars.multi .hb b{font-size:13px}.bars.multi .hb .b{height:11px}.bars.multi .hb small{font-size:11px}
.ab.ko{opacity:.35}

.lked{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}

.spt{font-style:normal;font-size:.72em;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.45);color:#ffd23f;margin-left:4px;vertical-align:middle}.spc{color:var(--teal)}
.atl{display:grid;gap:6px;margin-top:8px}.atr{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:7px 10px}.atr small{display:block;color:var(--muted);font-weight:700;font-size:12px}.atv{color:var(--teal);font-weight:900}.atv em{color:#7ee08a;font-style:normal;font-size:.85em}.atb{display:flex;gap:4px}.atb button{min-width:38px}.ptsb{display:inline-block;background:#ffd23f;color:#2b1a10;border-radius:8px;padding:1px 8px;font-weight:900;margin-left:6px}

$('#btSpd').addEventListener('click',e=>{SPEED=SPEED===1?2:SPEED===2?4:SPEED===4?10:1;e.target.textContent='x'+SPEED});
const sndL=()=>OPT.snd===false?'Silencio':OPT.snd==='fx'?'Sin música':'Música: sí';
$('#btSnd').addEventListener('click',e=>{OPT.snd=OPT.snd===false?true:OPT.snd==='fx'?false:'fx';saveOpt();e.target.textContent=sndL();if(OPT.snd===true||OPT.snd===undefined){audio();if(running)musicStart(MUS.idx)}else musicStop()});
$('#btSkip').addEventListener('click',()=>{if(running)skip=true});
$('#btAuto').addEventListener('click',e=>{if(bt&&bt.S[0].length>1)return;me.auto=!me.auto;save();e.target.textContent='Auto: '+(me.auto?'sí':'no')});
addEventListener('resize',()=>{ctx=null});

/* escalado explicado en habilidades */
(function(){const has=(t,re)=>re.test(t);Object.keys(AB).forEach(k=>{const A=AB[k];if(!A||A._sc)return;const t=(A.t||'').toLowerCase(),out=[];
 if(has(t,/cur|sana|vida|regener|renov|bebe|drena|roba/))out.push('Curación: +2,5% por punto del atributo de su clase (Inteligencia si viene de un objeto) y según la rareza y nivel del objeto');
 if(has(t,/venen|tóxic|toxic|plaga|sangr|maldi|quema|arde|fuego|llama/))out.push('Daño por turno: sube con el nivel del luchador; el veneno se acumula hasta x5 y reinicia su duración');
 if(has(t,/aturd|sin turno|atrap|enred|congel|paraliz/))out.push('Aturdir: acierta 45–85% según la rareza del objeto (máx. 70% si es de clase)');
 if(has(t,/daño|dispar|tajo|corte|crític|critic|ataca|flecha|bala|rayo|explos|lanza|misil|proyectil|aplasta|apuñal|estocada/)||(has(t,/golpe/)&&!has(t,/bloque|escudo/)))out.push('Daño: usa el escalado del arma equipada y +2,5% por punto del atributo de su clase (Inteligencia si viene de un objeto)');
 if(has(t,/escudo|bloque|protege|armadura|barrera|muro/))out.push('Defensa: más fuerte con objetos de mayor rareza');
 if(!out.length)out.push('Potencia: +2,5% por punto del atributo de su clase (Inteligencia si viene de un objeto) y según la rareza del objeto');
 out.push('Recarga: '+A.cd+' turnos (la Inteligencia la acorta hasta 35%)');
 A.t0=A.t;A.tl=out.join(' · ');A._sc=1})})();

if(me){me.team.forEach(f=>{const n=OLDMAP[f.cls];if(n){f.vis=f.cls;f.cls=n;f.path=null}})}
if(me){me.team.forEach(f=>derive(f))}if(me)save();titleScreen();
